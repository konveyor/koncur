worker_processes  1;
error_log /dev/stderr info;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  access_log /dev/stdout;

  server {
    listen 8443 ssl;
    # Namespace-agnostic: this is the only (default) server block, so it serves every SNI host
    # (e.g. maven-mirror.<namespace>.svc). TLS still uses the self-signed cert mounted below.
    server_name _;

    ssl_certificate     /certs/tls.crt;
    ssl_certificate_key /certs/tls.key;

    # Reverse-proxy ALL Maven traffic to Maven Central, served under our self-signed cert.
    # The cert is intentionally untrusted: this reproduces an insecure (private-CA /
    # self-signed) Maven repository so the analyzer's mvn.insecure.enabled path is exercised.
    location / {
      proxy_pass https://repo1.maven.org/maven2/;
      proxy_set_header Host repo1.maven.org;
      proxy_ssl_server_name on;
    }
  }
}
