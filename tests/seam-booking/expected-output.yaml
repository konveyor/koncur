    hibernate4-00039:
      description: Hibernate 5  - Oracle12cDialect maps byte[] and Byte[] to BLOB
      category: mandatory
      labels:
      - Hibernate
      - configuration
      - hibernate
      - konveyor.io/source=eap
      - konveyor.io/source=eap6
