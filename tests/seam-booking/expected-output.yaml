- name: eap8/eap7
  description: This ruleset provides analysis of Java EE applications that need to
    change certain CDI-related method calls.
  violations:
    hibernate-00005:
      description: Implicit name determination for sequences and tables associated
        with identifier generation has changed
      category: potential
      labels:
      - hibernate
      - konveyor.io/source
      - konveyor.io/target=eap
      - konveyor.io/target=eap8+
      - konveyor.io/target=hibernate
      - konveyor.io/target=hibernate6+
      - konveyor.io/target=quarkus
      - konveyor.io/target=quarkus3+
      incidents:
      - uri: file:///opt/input/source/src/org/jboss/seam/example/booking/Booking.java
        message: "The way in which Hibernate determines implicit names for sequences
          and tables associated with identifier generation has changed in 6.0 which
          may affect migrating applications. \n As of 6.0, Hibernate by default creates
          a sequence per entity hierarchy instead of a single sequence hibernate_sequence.
          \n Due to this change, users that previously used `@GeneratedValue(strategy
          = GenerationStrategy.AUTO)` or simply `@GeneratedValue` (since `AUTO` is
          the default), need to ensure that the database now contains sequences for
          every entity, named `<entity name>_seq`. For an entity Person, a sequence
          person_seq is expected to exist. \n It’s best to run hbm2ddl (e.g. by temporarily
          setting `hbm2ddl.auto=create`) to obtain a list of DDL statements for the
          sequences."
        codeSnip: "\n50      public BigDecimal getTotal() {\n51          return hotel.getPrice().multiply(new
          BigDecimal(getNights()));\n52      }\n53  \n54      @Transient\n55      public
          int getNights() {\n56          return (int) (checkoutDate.getTime() - checkinDate.getTime())
          / 1000 / 60 / 60 / 24;\n57      }\n58  \n59      @Id\n60      @GeneratedValue\n61
          \     public Long getId() {\n62          return id;\n63      }\n64  \n65
          \     public void setId(Long id) {\n66          this.id = id;\n67      }\n68
          \ \n69      @NotNull\n70      @Basic"
        lineNumber: 60
        variables:
          file: file:///opt/input/source/src/org/jboss/seam/example/booking/Booking.java
          kind: Property
          name: GeneratedValue
          package: org.jboss.seam.example.booking
      - uri: file:///opt/input/source/src/org/jboss/seam/example/booking/Hotel.java
        message: "The way in which Hibernate determines implicit names for sequences
          and tables associated with identifier generation has changed in 6.0 which
          may affect migrating applications. \n As of 6.0, Hibernate by default creates
          a sequence per entity hierarchy instead of a single sequence hibernate_sequence.
          \n Due to this change, users that previously used `@GeneratedValue(strategy
          = GenerationStrategy.AUTO)` or simply `@GeneratedValue` (since `AUTO` is
          the default), need to ensure that the database now contains sequences for
          every entity, named `<entity name>_seq`. For an entity Person, a sequence
          person_seq is expected to exist. \n It’s best to run hbm2ddl (e.g. by temporarily
          setting `hbm2ddl.auto=create`) to obtain a list of DDL statements for the
          sequences."
        codeSnip: "\n21      private Long id;\n22      private String name;\n23      private
          String address;\n24      private String city;\n25      private String state;\n26
          \     private String zip;\n27      private String country;\n28      private
          BigDecimal price;\n29  \n30      @Id\n31      @GeneratedValue\n32      public
          Long getId() {\n33          return id;\n34      }\n35  \n36      public
          void setId(Long id) {\n37          this.id = id;\n38      }\n39  \n40      @Length(max
          = 50)\n41      @NotNull"
        lineNumber: 31
        variables:
          file: file:///opt/input/source/src/org/jboss/seam/example/booking/Hotel.java
          kind: Property
          name: GeneratedValue
          package: org.jboss.seam.example.booking
      links:
      - url: https://github.com/hibernate/hibernate-orm/blob/6.0/migration-guide.adoc#implicit-identifier-sequence-and-table-name
        title: Hibernate ORM 6 migration guide - Implicit Identifier Sequence and
          Table Name
      effort: 3
    javax-to-jakarta-import-00001:
      description: The package 'javax' has been replaced by 'jakarta'.
      category: mandatory
      labels:
      - konveyor.io/source
      - konveyor.io/source=spring5
      - konveyor.io/target=eap
      - konveyor.io/target=eap8
