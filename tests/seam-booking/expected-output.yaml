          that delegates to an available logging framework (log4j or JDK logging).
          \n Additionally, it provides extra features such as EL expression evaluation.\n
          \n Java SE or EE does not have anything that correlates to this, but you
          can your own Logger with simple producer for this case like:\n \n ```java\n
          import javax.enterprise.inject.Produces; \n import javax.enterprise.inject.spi.InjectionPoint;
          \n \n @Singleton\n public class LoggerProducer \n \n }}\n ```\n \n and use
          it in your code like:\n \n ```java\n @Inject private transient Logger logger;\n
          ```"
