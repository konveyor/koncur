      incidents:
      - uri: file:///opt/input/source/src/org/jboss/seam/example/booking/Authenticator.java
        message: "\n                        Seam 2.2 and earlier is not supported
          on JBoss EAP 6 and above.\n                        Consider migration to
          Context Dependency Injection (CDI) standard which covers most of Seam 2
          core functionalities in\n                        a standardized, type safe
          and extensible way.\n                        \n                        Seam
          2.3 still could work on EAP 6.x, but is not maintained and officially supported
          on new EAP 6.x patched releases or EAP 7.x.\n\n                        There
          are two options available:\n                        \n                        1.
          Continue using Seam 2.x on EAP 6 but expect there are bugs or glitches and
          you need to fix it yourself.\n                        This approach is sometimes
          lower effort but the application will not use a tested and supported library
          and some Seam framework features doesn't have to work as expected.\n                        2.
          The similar approach as for point 1 but for Seam 2.3 runtime on EAP7 is
          not verified and therefore not recommended. Some Seam 2.3 features could
          work on EAP7,\n                        but the expected behavior can differ
          based on what your application uses and how.\n                        2.
          Switch to standard CDI beans and migrate to JSF 2.2 if your server platform
          is EAP 7+. This will require significant migration effort.\n                    "
