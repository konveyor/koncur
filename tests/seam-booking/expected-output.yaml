      incidents:
      - uri: file:///opt/input/source/src/org/jboss/seam/example/booking/BookingListAction.java
        message: "Both Seam 2 and CDI beans may produce and consume events in order
          to communicate with other beans. Unlike method invocation, events allow
          for decoupled architecture with no compile-time dependency.\n \n In Seam
          2, the type of an event is represented by a string value. Observer methods
          may observe one or more event types.\n \n Unlike Seam 2, the process of
          observer method resolution is type-safe in CDI. A CDI event is represented
          by a payload (any Java object) and a set of qualifiers. The Java types of
          the event payload together with qualifiers determine which observer methods
          are notified of the event"
        codeSnip: "\n41  \n42      @DataModel\n43      private List<Booking> bookings;\n44
          \     @DataModelSelection\n45      private Booking booking;\n46  \n47      @Logger\n48
          \     private Log log;\n49  \n50      @Factory\n51      @Observer(\"bookingConfirmed\")\n52
          \     public void getBookings() {\n53          bookings = em.createQuery(\"select
          b from Booking b where b.user.username = :username order by b.checkinDate\")\n54
          \                 .setParameter(\"username\", user.getUsername())\n55                  .getResultList();\n56
          \     }\n57  \n58      public void cancel() {\n59          log.info(\"Cancel
          booking: #{bookingList.booking.id} for #{user.username}\");\n60          Booking
          cancelled = em.find(Booking.class, booking.getId());\n61          if (cancelled
          != null) em.remove(cancelled);"
