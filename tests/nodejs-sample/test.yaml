name: nodejs-sample
description: Source analysis of nodejs application with custom rules
analysis:
    application: https://github.com/konveyor/analyzer-lsp#main/examples/nodejs
    context_lines: 0
    incident_selector: ""
    source: []
    target: []
    rules:
      - file:
          filePath: nodejs-rules.yaml
    disableDefaultRules: true
    analysisMode: source-only
timeout: 10m0s
expect:
    exitCode: 0
    output:
        file: expected-output.yaml
