- name: konveyor-analysis
  violations:
    golang-dependencies-rule-01:
      description: Testing golang dependencies
      category: potential
      incidents:
      - uri: file:///source/go.mod
        message: dependency golang.org/x/text with v0.3.7 found
        lineNumber: 0
        variables:
          name: golang.org/x/text
          version: v0.3.7
      - uri: file:///source/go.mod
        message: dependency k8s.io/apimachinery with v0.24.4 found
        lineNumber: 0
        variables:
          name: k8s.io/apimachinery
          version: v0.24.4
      effort: 1
    golang-sample-rule-01:
      description: ""
      category: potential
      incidents:
      - uri: file:///source/main.go
        message: golang function call
        lineNumber: 13
        variables:
          file: file:///opt/input/source/main.go
      effort: 1
    golang-sample-rule-02:
      description: ""
      category: potential
      incidents:
      - uri: file:///source/main.go
        message: golang main test
        lineNumber: 11
        variables:
          file: file:///opt/input/source/main.go
      effort: 1
