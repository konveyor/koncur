name: Koncur Repo CI testing

on:
  pull_request:
    branches:
      - "main"
      - "release-*"

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.set-tag.outputs.image_tag }}
    steps:
      - id: set-tag
        run: echo "image_tag=${{ github.base_ref == 'main' && 'latest' || github.base_ref }}" >> $GITHUB_OUTPUT

  run-kantra-test:
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        # Using macos to test amd64 and ubuntu to test arm
        # This is because you can't use container's on mac os arm runners.
        os: [macos-15-intel, ubuntu-24.04-arm, windows-latest]
        exclude:
          - os: macos-15-intel
    uses: ./.github/workflows/kantra.yaml
    with:
      os: ${{ matrix.os }}
      image_tag: ${{ needs.setup.outputs.image_tag }}

  # Java-analysis tests only, Kantra --run-local=true (see kantra-local.yaml). Skips nerd-dinner / python-sample.
  run-kantra-java-local-test:
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, ubuntu-24.04-arm, windows-latest]
        exclude:
          - os: macos-15-intel
    uses: ./.github/workflows/kantra-local.yaml
    with:
      os: ${{ matrix.os }}
      image_tag: ${{ needs.setup.outputs.image_tag }}


  run-hub-test:
    needs: setup
    secrets: inherit
    uses: ./.github/workflows/hub.yaml
    with:
      skip_maven: true
      image_tag: ${{ needs.setup.outputs.image_tag }}
