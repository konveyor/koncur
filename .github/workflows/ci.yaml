name: Koncur Repo CI testing

on:
  pull_request:
    branches:
      - "main"
      - "release-*"

jobs:
  gate:
    # Only run on the konveyor/koncur repo, not forks.
    if: github.repository == 'konveyor/koncur'
    runs-on: ubuntu-latest
    steps:
      - run: "true"

  unit-tests:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Vet
        run: go vet ./...

      - name: Run unit tests
        run: go test ./...

  setup:
    needs: gate
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.set-tag.outputs.image_tag }}
    steps:
      - id: set-tag
        run: |
          echo "image_tag=${{ github.base_ref == 'main' && 'latest' || github.base_ref }}" >> $GITHUB_OUTPUT

  # Full kantra tests run via the reusable workflow in konveyor/ci. It builds
  # the images under test and runs the OS matrix internally.
  run-kantra-test:
    needs: gate
    uses: konveyor/ci/.github/workflows/e2e-kantra-koncur.yaml@main

  # Java-analysis tests only, Kantra --run-local=true (see kantra-local.yaml). Skips nerd-dinner / python-sample.
  run-kantra-java-local-test:
    needs: [setup, gate]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, ubuntu-24.04-arm, windows-latest]
        exclude:
          - os: macos-15-intel
    uses: ./.github/workflows/kantra-local.yaml
    with:
      os: ${{ matrix.os }}
      skip_maven: false
      image_tag: ${{ needs.setup.outputs.image_tag }}

  # Tackle Hub tests run via the reusable workflow in konveyor/ci. It builds
  # the images under test and runs the test internally.
  run-hub-test:
    needs: gate
    uses: konveyor/ci/.github/workflows/e2e-hub-koncur.yaml@main
